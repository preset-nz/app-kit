[package]
name = "preset-app-kit"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The behaviour of a preset.nz desktop app: one command table feeding the native menu and the toolbar, Undo and Redo that say what they undo, text-field undo routing, and saving with the unsaved mark and the close guard."
repository = "https://github.com/preset-nz/app-kit"
readme = "README.md"
publish = false

[lib]
name = "preset_app_kit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
tauri-plugin-dialog = "2"
